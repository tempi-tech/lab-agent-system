services:
  bot:
    build: .
    container_name: lab-agent
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-u", "main.py"]
    volumes:
      # Mount the source code for easier development (optional)
      - ./src:/app/src
      - ./main.py:/app/main.py
      # Data directory for persistent storage
      - ./data:/app/data
