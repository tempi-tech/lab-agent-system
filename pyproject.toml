[project]
name = "labo-agent-system"
version = "0.1.0"
description = "AI Agent Platform for Discord Communities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py",
    "google-adk>=1.19.0",
    "google-genai>=1.52.0",
    "python-dotenv",
]

[tool.uv]
dev-dependencies = [
    "pytest",
    "black",
    "isort",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
