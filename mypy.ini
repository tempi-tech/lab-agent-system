[mypy]
python_version = 3.10
warn_unused_ignores = True
ignore_missing_imports = True
pretty = True
show_error_codes = True

# The repo is mid-migration to typing. We keep mypy running for new/critical
# modules while allowing legacy agents to remain untyped (for now).

[mypy-src.agents.lab_onboarder.*]
ignore_errors = True

[mypy-src.agents.invite_role_assigner.*]
ignore_errors = True

[mypy-src.agents.updates_assistant.*]
ignore_errors = True

[mypy-src.agents.quiz_master.*]
ignore_errors = True

[mypy-src.core.llm]
ignore_errors = True

